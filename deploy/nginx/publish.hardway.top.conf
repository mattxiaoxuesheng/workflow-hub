# Include in the host Nginx http{} context. Replace certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=publisher_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=publisher_ingest:10m rate=10r/m;
server {
    listen 80;
    server_name publish.hardway.top;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name publish.hardway.top;
    ssl_certificate /etc/nginx/ssl/publish.hardway.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/publish.hardway.top/privkey.pem;
    client_max_body_size 50m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location = /api/v1/login {
        limit_req zone=publisher_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/ingest {
        limit_req zone=publisher_ingest burst=3 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

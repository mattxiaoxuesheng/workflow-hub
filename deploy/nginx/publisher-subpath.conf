# Include inside the existing HTTPS server{} block.
location = /publisher {
    return 301 /publisher/;
}
location ^~ /publisher/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $publisher_backend wechat-publisher:8000;
    rewrite ^/publisher/(.*)$ /$1 break;
    proxy_pass http://$publisher_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Do not forward the StockLab root-scoped login cookie to Publisher.
    proxy_set_header Cookie "publisher_session=$cookie_publisher_session";
    client_max_body_size 50m;
    proxy_read_timeout 600s;
}

services:
  publisher:
    build:
      context: ..
      dockerfile: publisher/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:8000'
    env_file:
      - /opt/wechat-publisher/secrets/publisher.env
    volumes:
      - /opt/wechat-publisher/data:/app/data
      - ../publisher/config:/app/publisher/config:ro
      - ../publisher/templates:/app/publisher/templates:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

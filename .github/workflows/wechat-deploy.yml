name: Deploy Publisher to Tencent
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full main-branch commit SHA with a successfully built Publisher image
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: publisher-tencent-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: tencent-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify revision
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$IMAGE_SHA" origin/main
          git checkout --detach "$IMAGE_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image digest
        id: image
        env:
          REPO: ${{ github.repository }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          image="ghcr.io/${REPO,,}/wechat-publisher"
          digest=$(docker buildx imagetools inspect "$image:sha-$IMAGE_SHA" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/publisher_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/publisher_key ~/.ssh/known_hosts
      - name: Server pulls and starts the image
        env:
          SSH_HOST: ${{ secrets.TENCENT_SSH_HOST }}
          SSH_USER: ${{ secrets.TENCENT_SSH_USER }}
          SSH_PORT: ${{ secrets.TENCENT_SSH_PORT }}
          IMAGE: ${{ steps.image.outputs.ref }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          port=${SSH_PORT:-22}
          [[ "$port" =~ ^[0-9]+$ ]]
          release="/opt/wechat-publisher/releases/$IMAGE_SHA-$RUN_ID"
          ssh_args=(-i ~/.ssh/publisher_key -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" -p "$port" "$SSH_USER@$SSH_HOST" "sudo -n install -d -m 755 '$release' && sudo -n chown \$(id -u):\$(id -g) '$release'"
          scp "${ssh_args[@]}" -P "$port" deploy/docker-compose.tencent.yml deploy/backup.py deploy/pull-publisher.sh "$SSH_USER@$SSH_HOST:$release/"
          ssh "${ssh_args[@]}" -p "$port" "$SSH_USER@$SSH_HOST" "sudo -n chown -R root:root '$release' && sudo -n bash '$release/pull-publisher.sh' '$IMAGE'"
          echo "Deployed \`$IMAGE\` to Tencent" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/publisher_key

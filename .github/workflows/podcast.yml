name: 文档转播客
run-name: 'Podcast | ${{ inputs.script }} | ${{ inputs.request_id || github.run_number }}'
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'MD 路径，如 inputs/podcast/demo/script.md'
        required: true
        default: inputs/podcast/demo/script.md
        type: string
      voice_preset:
        description: '留空使用文稿配置；可填 zh-solo-female、zh-solo-male、zh-duo-female-male'
        default: ''
        type: string
      validate_only:
        description: '只检查格式，不联网配音'
        default: false
        type: boolean
      force:
        description: '忽略分段缓存，重新合成所有台词'
        default: false
        type: boolean
      request_id:
        description: '可选任务标识，用于 Agent 精确查找本次运行'
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: 'podcast-${{ github.ref }}-${{ inputs.script }}'
  cancel-in-progress: false
jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore speech cache
        if: ${{ !inputs.validate_only && !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: .podcast-cache
          key: 'podcast-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}'
          restore-keys: 'podcast-v1-${{ runner.os }}-${{ github.ref_name }}-'
      - name: Build container
        run: docker build -f workflows/podcast/Dockerfile -t workflow-hub-podcast .
      - name: Validate or generate
        env:
          SCRIPT: ${{ inputs.script }}
          VOICE_PRESET: ${{ inputs.voice_preset }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          mkdir -p output .podcast-cache
          args=(build --script "$SCRIPT" --voice-preset "$VOICE_PRESET")
          if [[ "$VALIDATE_ONLY" == true ]]; then args+=(--validate-only); fi
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          docker run --rm --user "$(id -u):$(id -g)" -e GITHUB_SHA -e GITHUB_RUN_ID -v "$PWD:/workspace" workflow-hub-podcast "${args[@]}"
      - name: Save speech cache (also preserves completed segments after a failed run)
        if: ${{ always() && !inputs.validate_only }}
        uses: actions/cache/save@v4
        with:
          path: .podcast-cache
          key: 'podcast-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Upload finished deliverables
        uses: actions/upload-artifact@v4
        with:
          name: 'podcast-${{ github.run_id }}-${{ github.run_attempt }}'
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('output/metadata.json')
          result = json.loads(path.read_text()) if path.exists() else json.loads(Path('output/validation.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('本次结果（产物保留 30 天，请及时下载）：\n\n```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n')
          PY

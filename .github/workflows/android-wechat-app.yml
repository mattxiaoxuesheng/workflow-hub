name: Android WeChat Publisher App

on:
  push:
    paths:
      - 'android/wechat-publisher-app/**'
      - '.github/workflows/android-wechat-app.yml'
  pull_request:
    paths:
      - 'android/wechat-publisher-app/**'
      - '.github/workflows/android-wechat-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Generate personal App credential
        shell: bash
        run: |
          TOKEN="app_$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$TOKEN"
          echo "PUBLISHER_APP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          {
            echo "# Keep this file private. Merge these values into /opt/wechat-publisher/secrets/publisher.env"
            echo "PUBLISHER_ANDROID_TOKEN=$TOKEN"
            echo "PUBLISHER_ANDROID_USER=admin"
          } > publisher-android.env

      - name: Lint, test, and build
        run: gradle -p android/wechat-publisher-app clean lintDebug testDebugUnitTest assembleDebug -PpublisherAppToken="$PUBLISHER_APP_TOKEN" --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wechat-publisher-android-debug
          path: |
            android/wechat-publisher-app/app/build/outputs/apk/debug/app-debug.apk
            publisher-android.env
          if-no-files-found: error
          retention-days: 30

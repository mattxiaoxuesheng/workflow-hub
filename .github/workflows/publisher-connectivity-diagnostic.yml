name: Publisher 网络连通性诊断（一次性）
run-name: 'Publisher connectivity diagnostic | ${{ github.run_number }}'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-connectivity-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 测试 TCP、TLS、IP、域名与 Host
        shell: bash
        run: |
          set +e
          IP='122.51.36.123'
          DOMAIN='stocklab.hardway.top'
          PATHNAME='/publisher/healthz'

          echo '=== 1. TCP 443 ==='
          python - <<'PY'
          import socket
          ip = "122.51.36.123"
          try:
              with socket.create_connection((ip, 443), timeout=10):
                  print("tcp_443=ok")
          except Exception as exc:
              print(f"tcp_443=failed type={type(exc).__name__} detail={exc}")
          PY

          echo '=== 2. TLS with correct SNI ==='
          timeout 15 openssl s_client -connect "${IP}:443" -servername "${DOMAIN}" -brief </dev/null 2>&1
          echo "openssl_exit=$?"

          echo '=== 3. HTTPS direct IP ==='
          curl -skS --connect-timeout 10 --max-time 20             -o /tmp/direct-ip-body             -w 'direct_ip_http=%{http_code} remote_ip=%{remote_ip} tls_verify=%{ssl_verify_result}\n'             "https://${IP}${PATHNAME}"
          echo " direct_ip_exit=$?"
          head -c 300 /tmp/direct-ip-body 2>/dev/null
          echo

          echo '=== 4. HTTPS normal domain ==='
          curl -skS --connect-timeout 10 --max-time 20             -o /tmp/domain-body             -w 'domain_http=%{http_code} remote_ip=%{remote_ip} tls_verify=%{ssl_verify_result}\n'             "https://${DOMAIN}${PATHNAME}"
          echo " domain_exit=$?"
          head -c 300 /tmp/domain-body 2>/dev/null
          echo

          echo '=== 5. HTTPS domain with --resolve ==='
          curl -skS --connect-timeout 10 --max-time 20             --resolve "${DOMAIN}:443:${IP}"             -o /tmp/resolve-body             -w 'resolve_http=%{http_code} remote_ip=%{remote_ip} tls_verify=%{ssl_verify_result}\n'             "https://${DOMAIN}${PATHNAME}"
          echo " resolve_exit=$?"
          head -c 300 /tmp/resolve-body 2>/dev/null
          echo

          echo '=== 6. HTTP IP with correct Host ==='
          curl -sS --connect-timeout 10 --max-time 20             -H "Host: ${DOMAIN}"             -o /tmp/http-host-body             -w 'http_host_code=%{http_code} remote_ip=%{remote_ip} redirect=%{redirect_url}\n'             "http://${IP}${PATHNAME}"
          echo " http_host_exit=$?"
          head -c 300 /tmp/http-host-body 2>/dev/null
          echo

          exit 0

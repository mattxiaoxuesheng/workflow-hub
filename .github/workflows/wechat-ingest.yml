name: 微信公众号内容导入
on:
  push:
    branches: [main]
    paths: ['inputs/wechat/**']
  workflow_dispatch:
    inputs:
      article:
        description: 文章目录，例如 inputs/wechat/acceptance
        required: true
        default: inputs/wechat/acceptance
      upload:
        description: 将内容包上传至腾讯云（需要配置Secrets）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wechat-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      articles: ${{ steps.articles.outputs.articles }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 识别变更文章目录
        id: articles
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_ARTICLE: ${{ inputs.article }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              article = os.environ['MANUAL_ARTICLE']
              p = Path(article)
              if p.is_absolute() or len(p.parts) != 3 or p.parts[:2] != ('inputs', 'wechat') or '..' in p.parts:
                  raise SystemExit('article 必须为 inputs/wechat 的直接子目录')
              articles = [p.as_posix()]
          else:
              before, after = os.environ['BEFORE'], os.environ['AFTER']
              if not before or set(before) == {'0'}:
                  before = subprocess.check_output(['git', 'hash-object', '-t', 'tree', '--stdin'], input=b'').decode().strip()
              paths = subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', before, after]).decode().split('\0')
              candidates = set()
              for path in paths:
                  parts = Path(path).parts
                  if len(parts) >= 4 and parts[:2] == ('inputs', 'wechat'):
                      candidates.add(Path(*parts[:3]).as_posix())
              articles = sorted(a for a in candidates if Path(a).is_dir())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('articles=' + json.dumps(articles, ensure_ascii=True) + '\n')
          print('文章目录:', articles)
          PY
  package:
    needs: discover
    if: needs.discover.outputs.articles != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        article: ${{ fromJSON(needs.discover.outputs.articles) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt
      - name: 校验并打包
        env:
          ARTICLE: ${{ matrix.article }}
        run: python -m workflows.wechat.package --article "$ARTICLE"
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-package-${{ github.run_id }}-${{ strategy.job-index }}
          path: output/wechat/article-package.zip
          if-no-files-found: error
          retention-days: 30
      - name: 上传腾讯云
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.upload)
        env:
          ARTICLE: ${{ matrix.article }}
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
          PUBLISHER_UPLOAD_TOKEN: ${{ secrets.PUBLISHER_UPLOAD_TOKEN }}
        run: python -m workflows.wechat.package --article "$ARTICLE" --upload
      - name: 非main分支上传提示
        if: inputs.upload && github.ref != 'refs/heads/main'
        run: exit 1

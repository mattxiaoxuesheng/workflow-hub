name: 微信公众号内容导入
on:
  workflow_dispatch:
    inputs:
      article:
        description: 文章目录，例如 inputs/wechat/acceptance
        required: true
        default: inputs/wechat/acceptance
      upload:
        description: 将内容包上传至腾讯云（需要配置Secrets）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: wechat-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt
      - name: 校验并打包
        env:
          ARTICLE: ${{ inputs.article }}
        run: python -m workflows.wechat.package --article "$ARTICLE"
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-package-${{ github.run_id }}
          path: output/wechat/article-package.zip
          if-no-files-found: error
          retention-days: 30
      - name: 上传腾讯云
        if: inputs.upload && github.ref == 'refs/heads/main'
        env:
          ARTICLE: ${{ inputs.article }}
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
          PUBLISHER_UPLOAD_TOKEN: ${{ secrets.PUBLISHER_UPLOAD_TOKEN }}
        run: python -m workflows.wechat.package --article "$ARTICLE" --upload
      - name: 非main分支上传提示
        if: inputs.upload && github.ref != 'refs/heads/main'
        run: exit 1

name: 微信公众号异星心智一次性导入
run-name: 'WeChat upload | alien-mind | ${{ github.run_number }}'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wechat-oneoff-alien-mind.yml'

permissions:
  contents: read

concurrency:
  group: wechat-ingest-main
  cancel-in-progress: false

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt
      - name: 校验并打包
        run: python -m workflows.wechat.package --article 'inputs/wechat/alien-mind-20260912'
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-package-${{ github.run_id }}
          path: output/wechat/article-package.zip
          if-no-files-found: error
          retention-days: 30
      - name: 诊断 Publisher 公网连接
        env:
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
        run: |
          python - <<'PY'
          import os, socket
          from urllib.parse import urlsplit
          import httpx
          url = os.environ.get('PUBLISHER_URL', '').rstrip('/')
          if not url:
              raise SystemExit('PUBLISHER_URL 未配置')
          parsed = urlsplit(url)
          print(f'scheme={parsed.scheme} host={parsed.hostname} path={parsed.path or "/"}')
          try:
              print(f'dns=ok ip={socket.gethostbyname(parsed.hostname)}')
          except Exception as exc:
              print(f'dns=failed {type(exc).__name__}: {exc}')
          try:
              response = httpx.get(url + '/healthz', timeout=15, follow_redirects=False)
              print(f'health_http={response.status_code} content_type={response.headers.get("content-type", "")[:80]}')
          except Exception as exc:
              print(f'health_error={type(exc).__name__}: {str(exc).replace(url, "<publisher>")}')
          PY
      - name: 上传腾讯云 Publisher
        env:
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
          PUBLISHER_UPLOAD_TOKEN: ${{ secrets.PUBLISHER_UPLOAD_TOKEN }}
        run: python -m workflows.wechat.package --article 'inputs/wechat/alien-mind-20260912' --upload

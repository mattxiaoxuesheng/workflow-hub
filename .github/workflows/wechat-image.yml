name: Build Publisher image
on:
  push:
    branches: [main]
    paths: ['publisher/**', 'deploy/docker-compose.tencent.yml', 'deploy/pull-publisher.sh', '.github/workflows/wechat-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publisher-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt pytest
      - run: python -m pytest publisher/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publisher/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: publisher/frontend
      - run: npm run build
        working-directory: publisher/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: publisher/frontend
      - run: npm run test:browser
        working-directory: publisher/frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPO: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPO,,}/wechat-publisher" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: publisher/Dockerfile
          platforms: linux/amd64
          build-args: PUBLISHER_BASE_PATH=/publisher/
          load: true
          push: false
          tags: ${{ steps.names.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check built image and rollback script
        env:
          IMAGE: ${{ steps.names.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker run --rm --network none --user 0 --entrypoint python -v "$PWD:/work:ro" "$IMAGE" /work/publisher/tests/deployment_sim.py success
          docker run --rm --network none --user 0 --entrypoint python -v "$PWD:/work:ro" "$IMAGE" /work/publisher/tests/deployment_sim.py failure
          docker run -d --name publisher-image-check --read-only --tmpfs /tmp --tmpfs /app/data:uid=10001,gid=10001 -e PUBLISHER_ORIGIN=https://test.invalid "$IMAGE"
          for attempt in $(seq 1 30); do
            if docker exec publisher-image-check python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200; assert b'root' in urllib.request.urlopen('http://127.0.0.1:8000/').read()"; then
              docker rm -f publisher-image-check
              exit 0
            fi
            sleep 2
          done
          docker logs publisher-image-check
          exit 1
      - name: Publish verified image
        id: publish
        env:
          IMAGE: ${{ steps.names.outputs.image }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"
      - env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published image — \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

name: Publisher HTTP IP 上传测试（一次性）
run-name: 'Publisher HTTP IP exact ingest probe | ${{ github.run_number }}'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publisher-http-ip-upload-test.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt
      - name: 校验并打包
        run: python -m workflows.wechat.package --article 'inputs/wechat/alien-mind-20260912'
      - name: 向 HTTP IP 的真实导入路径提交内容包
        shell: bash
        run: |
          set +e
          curl --show-error --silent             --connect-timeout 10 --max-time 30             --request POST             --header 'Authorization: Bearer routing-probe-no-real-token'             --form 'package=@output/wechat/article-package.zip;type=application/zip'             --dump-header /tmp/headers.txt             --output /tmp/body.txt             --write-out 'http_code=%{http_code} remote_ip=%{remote_ip} redirect=%{redirect_url}\n'             http://122.51.36.123/publisher/api/v1/ingest
          echo "curl_exit=$?"
          sed -n '1,20p' /tmp/headers.txt
          head -c 500 /tmp/body.txt
          echo

name: Project Meridian WeChat Upload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-meridian-upload.yml'
permissions:
  contents: read
concurrency:
  group: project-meridian-wechat-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt
      - name: 校验并打包
        run: python -m workflows.wechat.package --article inputs/wechat/project-meridian-war-changed
      - name: 上传腾讯云 Publisher
        env:
          PUBLISHER_URL: ${{ secrets.PUBLISHER_URL }}
          PUBLISHER_UPLOAD_TOKEN: ${{ secrets.PUBLISHER_UPLOAD_TOKEN }}
        run: python -m workflows.wechat.package --article inputs/wechat/project-meridian-war-changed --upload

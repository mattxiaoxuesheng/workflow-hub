name: WeChat Publisher offline CI
on:
  push:
    paths: ['publisher/**', 'workflows/wechat/**', 'inputs/wechat/**', 'deploy/**', '.github/workflows/wechat-*.yml']
  pull_request:
    paths: ['publisher/**', 'workflows/wechat/**', 'inputs/wechat/**', 'deploy/**', '.github/workflows/wechat-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r publisher/requirements.txt pytest==9.1.1
      - run: python -m pytest publisher/tests -q
      - run: python -m workflows.wechat.package --article inputs/wechat/acceptance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: publisher/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: publisher/frontend
      - run: npm run build
        working-directory: publisher/frontend
      - run: docker compose -f deploy/docker-compose.yml config --no-env-resolution --quiet
      - run: docker build -f publisher/Dockerfile -t wechat-publisher:ci .

plugins {
    id 'com.android.application'
}

def publisherAppToken = (project.findProperty('publisherAppToken') ?: '').toString()
def escapedPublisherAppToken = publisherAppToken.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'top.hardway.publisher'
    compileSdk 36

    defaultConfig {
        applicationId 'top.hardway.publisher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.1.0'
        buildConfigField 'String', 'PUBLISHER_APP_TOKEN', '"' + escapedPublisherAppToken + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
